<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Task Manager</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <h1 class="logo">Study Tasks</h1>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="tasks.html">Study Tasks</a></li>
            <li><a href="blog.html">Project Blog</a></li>
            <li><a href="ethics.html">Ethics & Privacy</a></li>
        </ul>
    </nav>

    <!-- Login Section -->
    <section id="loginSection" class="content-section">
        <h2>Login</h2>
        <p>Access to the study task manager is restricted.</p>

        <label>Username:</label>
        <input type="text" id="usernameInput">

        <label>Password:</label>
        <input type="password" id="passwordInput">

        <button id="loginBtn">Login</button>

        <p id="loginError" class="error-message"></p>
    </section>

    <!-- Task Manager Section -->
    <section id="taskSection" class="content-section" style="display:none;">
        <h2>Manage Your Study Tasks</h2>

        <!-- Task Form -->
        <div class="task-form">
            <label>Task Title:</label>
            <input type="text" id="taskTitle">

            <label>Course Code:</label>
            <input type="text" id="courseCode">

            <label>Course Name:</label>
            <input type="text" id="courseName">

            <label>Due Date:</label>
            <input type="date" id="dueDate">

            <label>Description:</label>
            <textarea id="taskDescription"></textarea>

            <label>Additional Notes:</label>
            <textarea id="taskNotes"></textarea>

            <button id="addTaskBtn">Add Task</button>
            <button id="updateTaskBtn" style="display:none;">Save Changes</button>

            <p id="taskError" class="error-message"></p>
        </div>

        <!-- Task List -->
        <h3>Current Tasks</h3>
        <table id="taskTable">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Course</th>
                    <th>Due Date</th>
                    <th>Description</th>
                    <th>Notes</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="taskTableBody"></tbody>
        </table>

        <!-- Date & Time -->
        <p id="dateTime" class="date-time"></p>
    </section>

    <script src="../js/tasks.js"></script>
</body>
</html>
